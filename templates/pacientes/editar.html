{% extends "base.html" %}
{% block title %}Editar Paciente{% endblock %}
{% block contenido %}
<div class="form-card">
    <h2>Editar Paciente</h2>
    <form action="{{ url_for('editar_paciente', id=paciente.usuario_id) }}" method="post">
        <div class="form-group">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" value="{{ paciente.nombre }}" required>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ paciente.email }}" readonly>
        </div>
        <div class="form-group">
            <label for="password">Contraseña (dejar en blanco para no cambiar):</label>
            <input type="password" id="password" name="password">
        </div>
        <div class="form-group">
            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono" name="telefono" value="{{ paciente.telefono or '' }}">
        </div>
        <div class="form-group">
            <label for="direccion">Dirección:</label>
            <input type="text" id="direccion" name="direccion" value="{{ paciente.direccion or '' }}">
        </div>
        <div class="form-group">
            <label for="codigo_postal">Código Postal:</label>
            <input type="text" id="codigo_postal" name="codigo_postal" value="{{ paciente.codigo_postal or '' }}">
        </div>
        <div class="form-group">
            <label for="genero">Género:</label>
            <select name="genero" id="genero">
                <option value="M" {% if paciente.genero == 'M' %}selected{% endif %}>Masculino</option>
                <option value="F" {% if paciente.genero == 'F' %}selected{% endif %}>Femenino</option>
                <option value="O" {% if paciente.genero == 'O' %}selected{% endif %}>Otro</option>
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-submit">Actualizar</button>
            <a href="{{ url_for('listar_pacientes') }}" class="link-cancel">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
