{% extends "base.html" %}
{% block title %}Nuevo Permiso{% endblock %}
{% block contenido %}
<div class="form-card">
    <h2>Nuevo Permiso</h2>
    <form method="post">
        <div class="form-group"><label>Nombre:</label>
            <input type="text" name="nombre_permiso" required></div>
        <div class="form-group"><label>Descripción:</label>
            <textarea name="descripcion" rows="3" required></textarea></div>
        <div class="form-group"><label>Categoría:</label>
            <select name="categoria">
                <option value="lectura">Lectura</option>
                <option value="escritura">Escritura</option>
                <option value="eliminacion">Eliminación</option>
                <option value="administracion">Administración</option>
            </select></div>
        <div class="form-group"><label>Módulo:</label>
            <input type="text" name="modulo" required></div>
        <div class="form-group">
            <label><input type="checkbox" name="es_critico"> Es crítico</label>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-submit">Guardar</button>
            <a href="{{ url_for('listar_permisos') }}" class="link-cancel">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
