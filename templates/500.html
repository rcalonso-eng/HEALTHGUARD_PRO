{% extends "base.html" %}
{% block title %}Error del servidor{% endblock %}
{% block contenido %}
<div class="error-page">
    <h1>500 - Error interno del servidor</h1>
    <img src="{{ url_for('static', filename='img/error500.png') }}" alt="Error 500">
    <p>Ocurrió un error inesperado. Por favor, inténtalo más tarde.</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Volver al inicio</a>
</div>
{% endblock %}
