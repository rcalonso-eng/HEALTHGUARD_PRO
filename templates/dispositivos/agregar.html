{% extends "base.html" %}
{% block title %}Nuevo Dispositivo{% endblock %}
{% block contenido %}
<div class="form-card">
    <h2>Nuevo Dispositivo</h2>
    <form method="post">
        <div class="form-group"><label>Tipo:</label>
            <select name="tipo_dispositivo">
                <option value="glucometro">Glucómetro</option>
                <option value="tensiometro">Tensiómetro</option>
                <option value="balanza">Balanza</option>
                <option value="oximetro">Oxímetro</option>
                <option value="pulsometro">Pulsómetro</option>
            </select></div>
        <div class="form-group"><label>Marca/Modelo:</label>
            <input type="text" name="marca_modelo" required></div>
        <div class="form-group"><label>Número de serie:</label>
            <input type="text" name="numero_serie"></div>
        <div class="form-actions">
            <button type="submit" class="btn-submit">Guardar</button>
            <a href="{{ url_for('listar_dispositivos', paciente_id=paciente.usuario_id) }}" class="link-cancel">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
