{% extends "base.html" %}
{% block title %}Nuevo Usuario{% endblock %}
{% block contenido %}
<div class="form-card">
    <h2>Nuevo Usuario</h2>
    <form method="post">
        <div class="form-group"><label>Nombre:</label>
            <input type="text" name="nombre" required></div>
        <div class="form-group"><label>Email:</label>
            <input type="email" name="email" required></div>
        <div class="form-group"><label>Contraseña:</label>
            <input type="password" name="password" required minlength="6"></div>
        <div class="form-group"><label>Teléfono:</label>
            <input type="text" name="telefono"></div>
        <div class="form-group"><label>Dirección:</label>
            <input type="text" name="direccion"></div>
        <div class="form-group"><label>Género:</label>
            <select name="genero">
                <option value="">--</option>
                <option value="M">Masculino</option>
                <option value="F">Femenino</option>
                <option value="O">Otro</option>
            </select></div>
        <div class="form-group"><label>Rol principal:</label>
            <select name="rol_id" required>
                {% for r in roles %}
                <option value="{{ r.rol_id }}">{{ r.nombre_rol }} (Nivel {{ r.nivel_permisos }})</option>
                {% endfor %}
            </select></div>
        <div class="form-actions">
            <button type="submit" class="btn-submit">Guardar</button>
            <a href="{{ url_for('listar_usuarios') }}" class="link-cancel">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
